name: Joker Bot 24/7

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '*/15 * * * *' # إعادة تشغيل تلقائية كل 15 دقيقة لضمان عدم نوم السيرفر
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies (FFmpeg & Build Tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install Node Dependencies
        run: npm install

      - name: Force Install Sharp (Ensuring compatibility)
        run: npm install sharp --build-from-source

      - name: Start Joker Bot Continuously
        run: |
          # تشغيل البوت في الخلفية مع حلقة تضمن إعادة فتحه فور انقطاعه
          while true; do
            node index.js
            echo "إعادة تشغيل البوت تلقائياً..."
            sleep 3
          done
