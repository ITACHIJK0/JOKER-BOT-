name: Fast Upload Helper

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: npm install || true

      - name: Confirm Files Ready
        run: |
          echo "تم فحص وترتيب الملفات بنجاح، يمكنك رفع ما تحتاجه من ملفات الآن عبر جيت هاب."
