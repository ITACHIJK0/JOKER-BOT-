name: ⚡ Fast Auto-Commit & Sync

on:
  push:
    branches:
      - main  # أو اسم الفرع الأساسي لديك (master/main)
  workflow_dispatch:

jobs:
  update-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # صلاحية الكتابة والتعديل على المستودع
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: ⚙️ Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 🔄 Pull Latest Changes
        run: git pull origin main --rebase || true

      - name: 📝 Make/Update Changes (مكان تعديل أو توليد ملفاتك)
        run: |
          # مثال: تحديث وقت التعديل لضمان وجود تغيير فعلي
          echo "Last updated: $(date)" > last-update.txt

      - name: 🚀 Commit & Push Changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "⚡ Auto-update files by Itachi & Joker workflow [skip ci]"
            git push origin main
          fi
